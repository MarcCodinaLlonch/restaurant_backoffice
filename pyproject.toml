[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
# PEP 8 permet ampliar el límit fins a 99 caràcters si l'equip ho acorda.
line-length = 99
extend-exclude = ["notebooks", "alembic"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N"]
